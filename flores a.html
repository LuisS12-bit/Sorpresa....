<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Muchos éxitos Mirlita!</title>
    <style>
        /* Estilos generales y fondo adaptable */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #2b233d 0%, #1c192b 50%, #0d0a14 100%);
            color: #fff;
            font-family: 'Georgia', serif;
            overflow: hidden; 
            height: 100dvh; 
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Contenedor del texto principal (Responsivo) */
        .main-text {
            text-align: center;
            z-index: 10;
            margin-top: clamp(3vh, 6vh, 12vh);
            width: 90%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Animación de entrada para el título */
        .main-text h1 {
            color: #ffde59; 
            font-size: clamp(1.8rem, 5vw, 3rem);
            margin-bottom: clamp(1rem, 3vh, 2rem);
            font-style: italic;
            opacity: 0; 
            animation: titleAppear 1.5s ease-out forwards, pulseText 2.5s infinite alternate 1.5s;
        }

        /* Contenedor extra para la animación de entrada de la caja */
        .message-wrapper {
            width: 100%;
            opacity: 0; 
            animation: boxAppear 1.5s ease-out 0.8s forwards;
            display: flex;
            justify-content: center;
        }

        /* Caja del mensaje personalizado */
        .message-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 222, 89, 0.5);
            border-radius: 20px;
            padding: clamp(15px, 3vw, 25px) clamp(20px, 4vw, 40px);
            width: 100%;
            box-sizing: border-box;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            animation: floatBox 5s ease-in-out infinite, pulseGlow 3s infinite alternate;
            line-height: 1.6;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            text-align: center;
        }

        .message-box p {
            margin: 0;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }

        /* Contenedores para el ramo animado */
        .bouquet-wrapper {
            position: absolute;
            bottom: -5vh; 
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 5;
            animation: slideUpBouquet 2s ease-out forwards;
            pointer-events: none;
        }

        .bouquet {
            width: 100%;
            max-width: clamp(250px, 50vw, 400px);
            height: clamp(250px, 50vh, 400px);
            background-image: url('https://cdn.pixabay.com/photo/2018/09/20/19/27/sunflowers-3691653_1280.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center bottom;
            transform-origin: bottom center;
            animation: sway 6s ease-in-out infinite alternate; 
        }

        /* Frases de fondo */
        .phrase {
            position: absolute;
            color: rgba(255, 235, 205, 0.9);
            font-size: clamp(0.9rem, 2.2vw, 1.2rem);
            font-style: italic;
            opacity: 0;
            z-index: 2;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            /* Duración de 7s exacta para coordinar con el JS */
            animation: floatText 7s ease-in-out forwards;
            white-space: nowrap;
            transform: translateX(-50%);
        }

        /* Trayectoria de la mariposa */
        .butterfly-path {
            position: absolute;
            z-index: 8;
            pointer-events: none;
        }

        /* Mariposa Vectorial */
        .butterfly {
            width: clamp(30px, 5vw, 50px);
            height: clamp(30px, 5vw, 50px);
            background-size: contain;
            background-repeat: no-repeat;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path fill="%23ffffff" d="M256 242c-20-40-50-80-110-100-50-16-100-10-120 40-16 40 10 90 60 110 40 16 80 10 110-20 20-20 40-30 60-30zm0 28c-20 40-50 80-110 100-50 16-100 10-120-40-16-40 10-90 60-110 40-16 80-10 110 20 20 20 40 30 60 30zm0-28c20-40 50-80 110-100 50-16 100-10 120 40 16 40-10 90-60 110-40 16-80 10-110-20-20-20-40-30-60-30zm0 28c20 40 50 80 110 100 50 16 100 10 120-40 16-40-10-90-60-110-40-16-80-10-110 20-20 20-40 30-60 30z"/></svg>');
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
            transform-origin: center;
            animation: flap 0.15s infinite alternate; 
        }

        /* Luciérnagas / Partículas */
        .sparkle {
            position: absolute;
            width: clamp(2px, 0.5vw, 4px);
            height: clamp(2px, 0.5vw, 4px);
            background-color: #ffde59;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px #ffde59;
            pointer-events: none;
            z-index: 1;
            animation: driftUp var(--duration) linear infinite, twinkle var(--twinkle-duration) infinite alternate;
        }

        /* --- ANIMACIONES DE ENTRADA Y BUCLE --- */
        @keyframes titleAppear {
            0% { opacity: 0; transform: translateY(-40px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); text-shadow: 0 0 10px rgba(255, 222, 89, 0.4); }
        }

        @keyframes boxAppear {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseText {
            0% { text-shadow: 0 0 10px rgba(255, 222, 89, 0.4); }
            100% { text-shadow: 0 0 25px rgba(255, 222, 89, 1); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(255, 222, 89, 0.1); }
            100% { box-shadow: 0 0 35px rgba(255, 222, 89, 0.4); border-color: rgba(255, 222, 89, 0.8); }
        }

        @keyframes floatBox {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes slideUpBouquet {
            0% { transform: translateY(150px) scale(0.8); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes sway {
            0% { transform: rotate(-4deg); }
            100% { transform: rotate(4deg); }
        }

        @keyframes floatText {
            0% { opacity: 0; transform: translateY(15px) scale(0.9) translateX(-50%); }
            15% { opacity: 1; transform: translateY(0) scale(1) translateX(-50%); }
            85% { opacity: 1; transform: translateY(-20px) scale(1) translateX(-50%); }
            100% { opacity: 0; transform: translateY(-30px) scale(0.9) translateX(-50%); }
        }

        @keyframes fly {
            0% { transform: translate(0, 0) rotate(0deg) scale(0.5); opacity: 0;}
            10% { opacity: 1; scale(1); }
            90% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity: 0;}
        }

        @keyframes flap {
            0% { transform: scaleX(1) scaleY(1.1); }
            100% { transform: scaleX(0.1) scaleY(0.9); }
        }

        @keyframes driftUp {
            0% { transform: translateY(110vh) scale(0.5); opacity: 0;}
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0;}
        }

        @keyframes twinkle {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="main-text">
        <h1>Feliz día de las flores amarillas</h1>
        
        <div class="message-wrapper">
            <div class="message-box">
                <p><strong>"Hoy es un gran día, Mirlita.</strong> Te mando los mejores deseos y mucha energía positiva para esa entrevista. Demuestra lo profesional que eres y que nadie te quite esa seguridad. <strong>¡Muchos éxitos, vas a salir con buenas noticias!"</strong></p>
            </div>
        </div>
    </div>

    <div class="bouquet-wrapper">
        <div class="bouquet"></div>
    </div>

    <script>
        const container = document.body;

        const phrases = [
            "Eres una amiga increíble 🌟",
            "Gracias por tu hermosa amistad 💛",
            "Siempre estaré aquí para ti ✨",
            "Tu energía es contagiosa 🌞",
            "Nuestra amistad vale oro 🌻",
            "Brillas con luz propia 💫",
            "Eres pura inspiración 🚀",
            "Qué suerte tenerte de amiga 💖",
            "Todo el éxito del mundo para ti 🍀",
            "¡Tú puedes con todo! 💪"
        ];

        // 3 zonas estrictas para que jamás se crucen
        const spawnZones = [
            { left: 28, top: 60 }, // Zona Izquierda
            { left: 72, top: 65 }, // Zona Derecha
            { left: 50, top: 55 }  // Zona Centro Superior
        ];
        let currentZone = 0; // Lleva el control de a qué zona le toca

        function spawnPhrase() {
            const el = document.createElement('div');
            el.className = 'phrase';
            
            // Elegir frase al azar
            el.innerText = phrases[Math.floor(Math.random() * phrases.length)];
            
            // Tomar las coordenadas de la zona que toca y añadirle un pequeñísimo 
            // margen aleatorio (+/- 2%) para que no se vea como un robot, pero siga seguro.
            const zone = spawnZones[currentZone];
            const leftPos = zone.left + (Math.random() * 4 - 2); 
            const topPos = zone.top + (Math.random() * 4 - 2);
            
            el.style.left = `${leftPos}vw`;
            el.style.top = `${topPos}vh`;
            
            container.appendChild(el);

            // Pasar el turno a la siguiente zona (0 -> 1 -> 2 -> 0...)
            currentZone = (currentZone + 1) % spawnZones.length;

            // La frase se destruye tras 7 segundos (lo que dura la animación CSS)
            setTimeout(() => {
                el.remove();
            }, 7000); 
        }

        function spawnButterfly() {
            const path = document.createElement('div');
            path.className = 'butterfly-path';
            
            const startX = Math.random() * 100;
            const startY = Math.random() * 50 + 50; 
            path.style.left = `${startX}vw`;
            path.style.top = `${startY}vh`;
            
            const tx = (Math.random() * 150 - 75) + 'vw';
            const ty = (Math.random() * -100 - 50) + 'vh';
            const rot = (Math.random() * 90 - 45) + 'deg';
            
            path.style.setProperty('--tx', tx);
            path.style.setProperty('--ty', ty);
            path.style.setProperty('--rot', rot);
            
            const flyDuration = Math.random() * 8 + 6;
            path.style.animation = `fly ${flyDuration}s cubic-bezier(0.25, 0.1, 0.25, 1) forwards`;

            const butterfly = document.createElement('div');
            butterfly.className = 'butterfly';
            butterfly.style.filter = `drop-shadow(0 0 5px rgba(255,255,255,0.5)) hue-rotate(${Math.random() * 360}deg)`;
            butterfly.style.animationDuration = `${Math.random() * 0.1 + 0.1}s`;

            path.appendChild(butterfly);
            container.appendChild(path);

            setTimeout(() => {
                path.remove();
            }, flyDuration * 1000);
        }

        function createSparkles() {
            const fragment = document.createDocumentFragment();
            const maxSparkles = window.innerWidth < 768 ? 25 : 50;

            for (let i = 0; i < maxSparkles; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle';
                s.style.left = `${Math.random() * 100}vw`;
                
                s.style.setProperty('--duration', `${Math.random() * 15 + 10}s`);
                s.style.setProperty('--twinkle-duration', `${Math.random() * 2 + 1}s`);
                s.style.animationDelay = `-${Math.random() * 15}s`; 
                
                fragment.appendChild(s);
            }
            container.appendChild(fragment);
        }

        // --- SECUENCIA DE INICIO LIMPIA ---
        setTimeout(() => {
            createSparkles();
            
            // Aparece la primera frase sola para no saturar la pantalla
            spawnPhrase(); 
            spawnButterfly();
            
            // Las frases salen cada 3 segundos exactos.
            // Al durar 7 segundos vivas y tener 3 zonas, ¡garantizamos matemáticamente que no chocarán!
            setInterval(spawnPhrase, 3000); 
            setInterval(spawnButterfly, 1800); 
            
        }, 1200); // Pequeño retraso para dejar brillar primero al texto principal

    </script>
</body>
</html>
